<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="ReturnsRunner - AI-powered returns automation"/><title>ReturnsRunner</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/><style>* {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: #f1f5f9;
        color: #0f172a;
      }

      #root {
        width: 100%;
        height: 100vh;
        overflow: auto;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Loading screen */
      .loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f1f5f9;
      }

      .loading h1 {
        color: #0f172a;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }

      .loading .tag {
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .loading p {
        color: #64748b;
        font-size: 16px;
        max-width: 320px;
        text-align: center;
        line-height: 1.5;
      }

      .spinner {
        border: 3px solid #e2e8f0;
        border-top: 3px solid #1d4ed8;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-top: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }</style><script defer="defer" src="bundle.js"></script></head><body><div id="root"><div class="loading"><p class="tag">Returns automation</p><h1>ReturnsRunner</h1><p>Loading your assistant…</p><div class="spinner"></div></div></div></body></html>
